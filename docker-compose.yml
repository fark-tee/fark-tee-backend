services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  s3:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Self-hosted OSRM routing server (set OSRM_BASE_URL="http://localhost:5001"
  # to use it). Requires a preprocessed .osrm dataset in ./osrm-data before
  # this service will start - see osrm-data/README.md. Host port 5001 (not
  # OSRM's default 5000) to avoid clashing with macOS AirPlay Receiver, which
  # listens on 5000.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/map.osrm
    ports:
      - "5001:5000"
    volumes:
      - ./osrm-data:/data

volumes:
  mongodb_data:
  s3_data:
